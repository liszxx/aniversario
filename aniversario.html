<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feliz Aniversário 🎉</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-1:#fff1e6;
    --bg-2:#ffe0ec;
    --ink:#3a2e39;
    --accent:#ff6f91;
    --accent-2:#ffc857;
    --accent-3:#7bd4c0;
    --card:#ffffff;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100vh;
    background: radial-gradient(circle at 20% 20%, var(--bg-2), var(--bg-1) 70%);
    font-family:'Fredoka', sans-serif;
    color:var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow-x:hidden;
    position:relative;
  }

  #confetti-canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
    z-index:5;
  }

  .stage{
    position:relative;
    width:100%;
    max-width:520px;
    padding:32px 20px;
    text-align:center;
    z-index:2;
  }

  /* ---- Envelope (antes do clique) ---- */
  #envelope-view{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:28px;
  }

  .envelope{
    width:min(78vw, 260px);
    aspect-ratio: 3 / 2;
    position:relative;
    cursor:pointer;
    filter:drop-shadow(0 18px 30px rgba(0,0,0,.18));
    animation: float 3.4s ease-in-out infinite;
  }
  @keyframes float{
    0%,100%{ transform:translateY(0px) rotate(-1deg); }
    50%{ transform:translateY(-10px) rotate(1deg); }
  }
  .envelope-body{
    position:absolute; inset:0;
    background:var(--card);
    border-radius:14px;
    overflow:hidden;
  }
  .envelope-flap{
    position:absolute;
    top:0; left:0; right:0;
    height:58%;
    background:var(--accent);
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    transform-origin: top;
    transition: transform .5s cubic-bezier(.6,-0.28,.74,.05);
  }
  .envelope-seal{
    position:absolute;
    top:50%; left:50%;
    width:46px; height:46px;
    background:var(--accent-2);
    border-radius:50%;
    transform:translate(-50%,-50%);
    display:flex; align-items:center; justify-content:center;
    font-size:22px;
    box-shadow:0 4px 10px rgba(0,0,0,.15);
    z-index:3;
  }

  .prompt-text{
    font-family:'Caveat', cursive;
    font-size:clamp(28px,6vw,38px);
    font-weight:700;
    margin:0;
  }

  .cta-btn{
    appearance:none;
    border:none;
    cursor:pointer;
    background:var(--accent);
    color:#fff;
    font-family:'Fredoka', sans-serif;
    font-weight:600;
    font-size:17px;
    padding:14px 34px;
    border-radius:999px;
    box-shadow:0 10px 22px rgba(255,111,145,.4);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .cta-btn:hover{ transform:translateY(-2px); }
  .cta-btn:active{ transform:translateY(0px) scale(.97); }

  /* ---- Comemoração (depois do clique) ---- */
  #celebration-view{
    display:none;
    flex-direction:column;
    align-items:center;
    gap:10px;
  }
  #celebration-view.show{ display:flex; }

  .gif-frame img{
    max-width: 280px;
    width: 80vw;
    border-radius: 18px;
    box-shadow: 0 16px 32px rgba(0,0,0,.2);
  }

  .headline{
    font-family:'Caveat', cursive;
    font-weight:700;
    font-  .headline{
    font-family:'Caveat', cursive;
    font-weight:700;
    font-size:clamp(38px,9vw,58px);
    margin:8px 0 0 0;
    color:var(--accent);
    line-height:1.05;
    opacity:0;
    transform:translateY(14px);
  }
  .subline{
    font-size:16px;
    max-width:360px;
    margin:10px auto 0;
    opacity:0;
    transform:translateY(10px);
    line-height:1.5;
  }

  .reveal-in{
    animation: revealUp .7s ease forwards;
  }
  @keyframes revealUp{
    to{ opacity:1; transform:translateY(0); }
  }

  .balloons{
    position:absolute;
    inset:0;
    pointer-events:none;
    overflow:visible;
    z-index:1;
  }
  .balloon{
    position:absolute;
    bottom:-120px;
    width:40px; height:52px;
    border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;
    opacity:0;
  }
  .balloon::after{
    content:'';
    position:absolute;
    left:50%; top:100%;
    width:2px; height:60px;
    background:rgba(0,0,0,.15);
    transform:translateX(-50%);
  }
  .show .balloon{ animation: rise 5.5s ease-in forwards; }
  @keyframes rise{
    0%{ opacity:0; transform:translateY(0) translateX(0); }
    8%{ opacity:.95; }
    100%{ opacity:0; transform:translateY(-620px) translateX(var(--drift,20px)); }
  }

  @media (prefers-reduced-motion: reduce){
    .envelope{ animation:none; }
    .balloon{ animation:none !important; opacity:0 !important; }
    .headline, .subline{ animation:none; opacity:1; transform:none; }
  }
</style>
</head>
<body>

<canvas id="confetti-canvas"></canvas>

<div class="stage">

  <div id="envelope-view">
    <p class="prompt-text">Tem uma coisa pra você...</p>
    <div class="envelope" id="envelope" role="button" tabindex="0" aria-label="Abrir presente de aniversário">
      <div class="envelope-body"></div>
      <div class="envelope-flap" id="flap"></div>
      <div class="envelope-seal">🎂</div>
    </div>
    <button class="cta-btn" id="open-btn">clique aqui</button>
  </div>

  <div id="celebration-view">
    <div class="balloons" id="balloons"></div>

    <!-- TROQUE O src ABAIXO PELO SEU GIF -->
   <video
  id="bday-video"
  src="parabens.mp4"
  loop
  playsinline
  style="
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 0;
  ">
</video>
  </div>

</div>

<script>
(function(){
  const envelope = document.getElementById('envelope');
  const openBtn = document.getElementById('open-btn');
  const envelopeView = document.getElementById('envelope-view');
  const celebrationView = document.getElementById('celebration-view');
  const flap = document.getElementById('flap');
  const balloonsWrap = document.getElementById('balloons');
  const canvas = document.getElementById('confetti-canvas');
  const ctx = canvas.getContext('2d');

  function resize(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const colors = ['#ff6f91','#ffc857','#7bd4c0','#ffffff','#c77dff'];

  function spawnBalloons(){
    balloonsWrap.innerHTML = '';
    const count = 9;
    for(let i=0;i<count;i++){
      const b = document.createElement('div');
      b.className = 'balloon';
      const left = 5 + Math.random()*90;
      const drift = (Math.random()*80 - 40) + 'px';
      const delay = (Math.random()*1.4).toFixed(2) + 's';
      const color = colors[i % colors.length];
      b.style.left = left + '%';
      b.style.background = color;
      b.style.setProperty('--drift', drift);
      b.style.animationDelay = delay;
      balloonsWrap.appendChild(b);
    }
  }

  let particles = [];
  function burstConfetti(){
    const centerX = canvas.width/2;
    const centerY = canvas.height*0.35;
    const n = reduceMotion ? 0 : 140;
    for(let i=0;i<n;i++){
      const angle = Math.random()*Math.PI*2;
      const speed = 4 + Math.random()*9;
      particles.push({
        x: centerX, y: centerY,
        vx: Math.cos(angle)*speed,
        vy: Math.sin(angle)*speed - 3,
        size: 5 + Math.random()*5,
        color: colors[Math.floor(Math.random()*colors.length)],
        rot: Math.random()*Math.PI,
        vr: (Math.random()-0.5)*0.3,
        life: 0,
        maxLife: 130 + Math.random()*60,
        shape: Math.random() > 0.5 ? 'rect' : 'circle'
      });
    }
  }

  function tick(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    particles.forEach(p=>{
      p.life++;
      p.vy += 0.13;
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.vr;
      const fade = Math.max(0, 1 - p.life/p.maxLife);
      ctx.save();
      ctx.globalAlpha = fade;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      if(p.shape === 'rect'){
        ctx.fillRect(-p.size/2, -p.size/3, p.size, p.size*0.6);
      } else {
        ctx.beginPath();
        ctx.arc(0,0,p.size/2,0,Math.PI*2);
        ctx.fill();
      }
      ctx.restore();
    });
    particles = particles.filter(p => p.life < p.maxLife);
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  let opened = false;
  function openGift(){
  if(opened) return;
  opened = true;
  flap.style.transform = 'rotateX(180deg)';
  spawnBalloons();
  burstConfetti();
  setTimeout(()=> burstConfetti(), 350);
  setTimeout(()=>{
    envelopeView.style.display = 'none';
    celebrationView.classList.add('show');
    document.getElementById('bday-video').play(); // toca o vídeo com som aqui
  }, 420);
}

  openBtn.addEventListener('click', openGift);
  envelope.addEventListener('click', openGift);
  envelope.addEventListener('keydown', (e)=>{
    if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openGift(); }
  });
})();
</script>

</body>
</html>
